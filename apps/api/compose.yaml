services:
  mongo:
    image: mongo:8.0
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - archive-mongo:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - >-
          try { rs.status(); } catch (error) {
            if (error.code !== 94) throw error;
            rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]});
          }
          if (!db.hello().isWritablePrimary) quit(1);
      interval: 3s
      timeout: 5s
      retries: 20
  mailpit:
    image: axllent/mailpit:v1.28.0
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  archive-mongo:
