server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /sitemap.xml {
        proxy_pass http://api:3000/api/v1/archive/sitemap.xml;
    }

    location ~ ^/materials/(?<share_slug>[a-z0-9]+(?:-[a-z0-9]+)*)/?$ {
        ssi on;
        etag off;
        add_header Cache-Control "no-store" always;
        try_files /material.html =404;
    }

    location = /material.html {
        internal;
    }

    location /__material-share/ {
        internal;
        proxy_pass http://api:3000/api/v1/materials/;
        proxy_set_header Accept-Encoding "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    location /api/ {
        proxy_pass http://api:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /media/ {
        proxy_pass http://media:8080;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
