<nb-layout>
  <nb-layout-header>
    <div class="header">
      <a class="brand" routerLink="/">
        <nb-icon icon="archive-outline" aria-hidden="true"></nb-icon>
        <span>{{ presentation().siteName }}</span>
      </a>
      <div class="header-actions">
        <a nbButton ghost routerLink="/archive">Архив</a>
        <a
          *nbIsGranted="['view', 'back-office']"
          nbButton
          ghost
          status="primary"
          routerLink="/admin"
        >
          Работен панел
        </a>
        <ng-template [nbIsGranted]="['view', 'account']">
          <a nbButton ghost status="primary" routerLink="/media/upload">Качи файл</a>
          <a nbButton ghost status="primary" routerLink="/account">Профил</a>
          <button nbButton ghost [disabled]="signingOut()" (click)="logout()">Изход</button>
        </ng-template>
        <a *nbIsGranted="['sign-in', 'session']" nbButton status="primary" routerLink="/login"
          >Вход</a
        >
      </div>
    </div>
  </nb-layout-header>

  <nb-layout-column>
    <main>
      @if (!inBackOffice() && presentation().banners.length) {
        <app-site-notices [banners]="presentation().banners" />
      }
      <router-outlet />
    </main>
  </nb-layout-column>
  @if (!inBackOffice() && hasFooter()) {
    <nb-layout-footer><app-site-footer [settings]="presentation()" /></nb-layout-footer>
  }
</nb-layout>
