openapi: 3.0.3
info:
  title: The Bulgaria We Lost API
  version: 1.0.0
  description: Unified contract for the Angular application, NestJS control plane and .NET media plane.
servers:
  - url: /
tags:
  - name: Archive search
  - name: Admin search
  - name: Health
  - name: Auth
  - name: Back office
  - name: Dashboard
  - name: Admin site settings
  - name: Public site settings
  - name: Audit
  - name: Admin users
  - name: Admin media
  - name: Admin storage
  - name: Admin operations
  - name: Internal operations
  - name: Publishing
  - name: Moderation
  - name: Authoring
  - name: Catalog
  - name: Media
  - name: Internal media
    description: Private service-to-service operations. Never call these from a browser.
paths:
  /api/v1/archive/search:
    get:
      tags:
        - Archive search
      operationId: searchArchive
      parameters:
        - &a2
          $ref: "#/components/parameters/CorrelationId"
        - name: q
          in: query
          schema:
            type: string
            maxLength: 150
        - name: type
          in: query
          schema:
            type: string
            enum:
              - Story
              - Document
              - PhotoEssay
              - Episode
        - name: topicId
          in: query
          schema: &a1
            type: string
            format: uuid
        - name: categoryId
          in: query
          schema: *a1
        - name: language
          in: query
          schema:
            type: string
            maxLength: 12
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 220
      responses:
        "200":
          description: Successful archive search operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ArchiveSearchPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/search/rebuild:
    post:
      tags:
        - Admin search
      operationId: rebuildArchiveSearch
      security:
        - bearerAuth: []
      parameters:
        - *a2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RebuildSearchPage"
      responses:
        "200":
          description: Successful archive search operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RebuildSearchResult"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/search/metrics:
    get:
      tags:
        - Admin search
      operationId: getArchiveSearchMetrics
      security:
        - bearerAuth: []
      parameters:
        - *a2
      responses:
        "200":
          description: Successful archive search operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchMetrics"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: API and MongoDB are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/login:
    post:
      tags: [Auth]
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT access and refresh tokens.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/register:
    post:
      tags: [Auth]
      operationId: register
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmail
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        $ref: "#/components/requestBodies/Hash"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/confirm/new:
    post:
      tags: [Auth]
      operationId: confirmNewEmail
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        $ref: "#/components/requestBodies/Hash"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/forgot/password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/reset/password:
    post:
      tags: [Auth]
      operationId: resetPassword
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current account profile.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Auth]
      operationId: updateProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Rotated JWT tokens.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout/all:
    post:
      tags: [Auth]
      operationId: logoutAll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/enrollment:
    post:
      tags: [Auth]
      operationId: startMfaEnrollment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaEnrollmentRequest"
      responses:
        "200":
          description: One-time TOTP enrollment values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrollment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "200":
          description: Recovery codes shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaRecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/recover:
    post:
      tags: [Auth]
      operationId: recoverMfa
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaRecoveryCodeRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/me:
    get:
      tags: [Back office]
      operationId: getBackOfficePrincipal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current editor or administrator principal.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackOfficePrincipal"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboardSummary
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Live editor counts and administrative counts when authorized.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/audit-events:
    get:
      tags: [Audit]
      operationId: listAuditEvents
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: actorId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, pattern: "^[A-Za-z][A-Za-z0-9]{0,99}$", maxLength: 100 }
        - name: targetType
          in: query
          schema:
            $ref: "#/components/schemas/AuditTargetType"
        - name: targetId
          in: query
          schema: { type: string, format: uuid }
        - name: outcome
          in: query
          schema:
            $ref: "#/components/schemas/AuditOutcome"
        - name: fromUtc
          in: query
          description: Inclusive UTC bound with a Z suffix.
          schema: { type: string, format: date-time }
        - name: toUtc
          in: query
          description: Exclusive UTC bound with a Z suffix.
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          description: Signed continuation bound to the active filters.
          schema: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Administrator journal ordered by time and event ID, newest first.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/audit-events/{id}:
    get:
      tags: [Audit]
      operationId: getAuditEvent
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Administrator journal detail with redacted reason and structured changes.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditEventDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/site-settings:
    get:
      tags: [Admin site settings]
      operationId: getAdminSiteSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          $ref: "#/components/responses/SiteSettings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      tags: [Admin site settings]
      operationId: replaceAdminSiteSettings
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: If-Match
          in: header
          required: true
          description: Current strong settings ETag.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSiteSettingsRequest"
      responses:
        "200":
          $ref: "#/components/responses/SiteSettings"
        "412":
          $ref: "#/components/responses/Problem"
        "422":
          $ref: "#/components/responses/Problem"
        "428":
          $ref: "#/components/responses/Problem"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/site-settings:
    get:
      tags: [Public site settings]
      operationId: getPublicSiteSettings
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current public presentation and visible featured materials in display order.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSiteSettings"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-connection-profiles:
    get:
      tags: [Admin storage]
      operationId: listStorageConnectionProfiles
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Successful storage operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageConnectionProfilePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-locations:
    get:
      tags: [Admin storage]
      operationId: listStorageLocations
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/StorageLocationStatus"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Successful storage operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Admin storage]
      operationId: createStorageLocation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[a-zA-Z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStorageLocationRequest"
      responses:
        "201":
          description: Successful storage operation.
          headers:
            Location:
              schema: { type: string }
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-locations/{id}:
    get:
      tags: [Admin storage]
      operationId: getStorageLocation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Successful storage operation.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Admin storage]
      operationId: editStorageLocation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: If-Match
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EditStorageLocationRequest"
      responses:
        "200":
          description: Successful storage operation.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-locations/{id}/health:
    get:
      tags: [Admin storage]
      operationId: getStorageHealth
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Successful storage operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHealth"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-locations/{id}/asset-issues:
    get:
      tags: [Admin storage]
      operationId: listStorageAssetIssues
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: kind
          in: query
          schema:
            $ref: "#/components/schemas/StorageAssetIssueKind"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        "200":
          description: Successful storage operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageAssetIssuePage"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-locations/{id}/connection-checks:
    post:
      tags: [Admin storage]
      operationId: checkStorageConnection
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[a-zA-Z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckStorageConnectionRequest"
      responses:
        "200":
          description: Successful storage operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHealth"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/storage-locations/{id}/transitions:
    post:
      tags: [Admin storage]
      operationId: transitionStorageLocation
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128, pattern: "^[a-zA-Z0-9_-]+$" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionStorageLocationRequest"
      responses:
        "200":
          description: Successful storage operation.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageLocationDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/media-assets:
    get:
      tags: [Admin media]
      operationId: listAdminMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: type
          in: query
          schema: { type: string, enum: [Image, Pdf, Other] }
        - name: processingStatus
          in: query
          schema: { type: string, enum: [Pending, Claimed, Ready, Failed] }
        - name: accessStatus
          in: query
          schema: { type: string, enum: [Active, Hidden, Restricted, Removed] }
        - name: rightsStatus
          in: query
          schema: { type: string, enum: [Recorded, Missing] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 80 }
      responses:
        "200":
          description: Successful media operation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMediaPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/media-assets/{id}:
    get:
      tags: [Admin media]
      operationId: getAdminMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Successful media operation.
          headers:
            ETag:
              schema: { type: string }
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminMediaDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Admin media]
      operationId: editAdminMedia
      security:
        - bearerAuth: []
      parameters:
