          content:
            application/json:
              schema:
                type: array
                items: { type: string, maxLength: 100 }
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/storage/{locationId}/probe:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: probeStorage
      security:
        - mediaProbeToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
      description: Private, rotated service credential.
    backupReporterToken:
      type: http
      scheme: bearer
      description: Independent internal operations reporting credential.
    mediaProbeToken:
      type: http
      scheme: bearer
      description: Independent credential for the private storage health operations.
  parameters:
    AdminUserId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    AccountSanctionId:
      name: sanctionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    AdminUserCommandKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4 for replaying the same command.
      schema: { type: string, format: uuid }
    ModerationCaseId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ModerationIdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID v4. Reuse with the same payload after a retryable error.
      schema: { type: string, format: uuid }
    AuthorCatalogField:
      name: field
      in: path
      required: true
      schema:
        type: string
        enum: [categoryIds, topicIds, sourceIds]
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation ID. The server echoes it or creates a safe value.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MaterialSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    CatalogKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [topics, categories, entities, places, sources, archive-institutions]
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 180
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong material ETag returned by the latest successful read or write.
      schema:
        type: string
    Variant:
      name: variant
      in: path
      required: true
      schema:
        type: string
        enum: [original, preview]
    MediaGrant:
      name: grant
      in: query
      required: true
      schema:
        type: string
        maxLength: 4096
  headers:
    CorrelationId:
      description: Correlates logs and Problem Details across services.
      required: true
      schema:
        type: string
    MaterialEtag:
      description: Strong optimistic-concurrency token for the material aggregate.
      required: true
      schema:
        type: string
    CatalogEtag:
      description: Strong optimistic-concurrency token for one catalog entry.
      required: true
      schema:
        type: string
  requestBodies:
    Hash:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HashRequest"
  responses:
    SiteSettings:
      description: Site presentation, including disabled banners, at the current version.
      headers:
        ETag:
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/SiteSettings"
    ModerationCaseDetail:
      description: Moderation case, current material state and permitted decisions.
      headers:
        ETag:
          description: Current case version for conditional updates.
          schema: { type: string }
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ModerationCaseDetail"
    NoContent:
      description: Operation completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
    BinaryContent:
      description: Authorized media bytes.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Accept-Ranges:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Problem:
      description: RFC 9457 compatible error with a stable application code.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    ArchiveSearchItem:
      type: object
      required:
        - id
        - slug
        - type
        - language
        - title
      properties:
        id: &a2
          type: string
          format: uuid
        slug: &a1
          type: string
        type:
          type: string
          enum:
            - Story
            - Document
            - PhotoEssay
            - Episode
        language: *a1
        title: *a1
        summary: *a1
    ArchiveSearchPage:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ArchiveSearchItem"
        nextCursor: *a1
    RebuildSearchPage:
      type: object
      properties:
        after: *a2
    RebuildSearchResult:
      type: object
      required:
        - processed
      properties:
        processed: &a3
          type: integer
          minimum: 0
        nextAfter: *a2
    SearchMetrics:
      type: object
      required:
        - enabled
        - pending
        - retrying
      properties:
        enabled:
          type: boolean
        pending: *a3
        retrying: *a3
        oldestPendingAtUtc:
          type: string
          format: date-time
        lastProjectedAtUtc:
          type: string
          format: date-time
    ModerationStatus:
      type: string
      enum: [Open, UnderReview, Resolved]
    ModerationPriority:
      type: string
      enum: [High, Normal]
    ModerationType:
      type: string
      enum: [Rights, Content]
    ReportReason:
      type: string
      enum: [Copyright, Privacy, Inaccuracy, Other]
    ModerationDecision:
      type: string
      enum: [Dismiss, RequestCorrection, WithdrawMaterial, RestoreMaterial]
    CreateModerationReportRequest:
      type: object
      required: [reasonCode]
      properties:
        reasonCode:
          $ref: "#/components/schemas/ReportReason"
        description: { type: string, maxLength: 1500 }
