openapi: 3.0.3
info:
  title: The Bulgaria We Lost API
  version: 1.0.0
  description: Unified contract for the Angular application, NestJS control plane and .NET media plane.
servers:
  - url: /
tags:
  - name: Health
  - name: Auth
  - name: Back office
  - name: Publishing
  - name: Authoring
  - name: Catalog
  - name: Media
  - name: Internal media
    description: Private service-to-service operations. Never call these from a browser.
paths:
  /api/v1/health:
    get:
      tags: [Health]
      operationId: getApiHealth
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: API and MongoDB are available.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/login:
    post:
      tags: [Auth]
      operationId: login
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT access and refresh tokens.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/register:
    post:
      tags: [Auth]
      operationId: register
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/confirm:
    post:
      tags: [Auth]
      operationId: confirmEmail
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        $ref: "#/components/requestBodies/Hash"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/email/confirm/new:
    post:
      tags: [Auth]
      operationId: confirmNewEmail
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        $ref: "#/components/requestBodies/Hash"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/forgot/password:
    post:
      tags: [Auth]
      operationId: requestPasswordReset
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/reset/password:
    post:
      tags: [Auth]
      operationId: resetPassword
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/me:
    get:
      tags: [Auth]
      operationId: getProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current account profile.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Auth]
      operationId: updateProfile
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: Updated profile.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Profile"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Rotated JWT tokens.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenPair"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/logout/all:
    post:
      tags: [Auth]
      operationId: logoutAll
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/enrollment:
    post:
      tags: [Auth]
      operationId: startMfaEnrollment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaEnrollmentRequest"
      responses:
        "200":
          description: One-time TOTP enrollment values.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaEnrollment"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/enrollment/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrollment
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "200":
          description: Recovery codes shown exactly once.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MfaRecoveryCodes"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaCodeRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/auth/mfa/recover:
    post:
      tags: [Auth]
      operationId: recoverMfa
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MfaRecoveryCodeRequest"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/me:
    get:
      tags: [Back office]
      operationId: getBackOfficePrincipal
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Current editor or administrator principal.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackOfficePrincipal"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/materials:
    get:
      tags: [Publishing]
      operationId: listMaterials
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Materials visible to the current editor or administrator.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Publishing]
      operationId: createMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaterialRequest"
      responses:
        "201":
          description: Material and its first working revision.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/materials/{id}:
    get:
      tags: [Publishing]
      operationId: getMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Current working and published pointers for a material.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Publishing]
      operationId: updateMaterialDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaterialDraftRequest"
      responses:
        "200":
          description: A new immutable working revision.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/materials/{id}/transitions:
    post:
      tags: [Publishing]
      operationId: transitionMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransitionMaterialRequest"
      responses:
        "200":
          description: Material after the editorial state transition.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/materials/{id}/revisions:
    get:
      tags: [Publishing]
      operationId: listMaterialRevisions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: Immutable revision history, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRevisionPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/materials/{id}/revisions/{number}:
    get:
      tags: [Publishing]
      operationId: getMaterialRevision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
        - $ref: "#/components/parameters/RevisionNumber"
      responses:
        "200":
          description: One immutable material revision.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialRevisionDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/materials/{id}/revision-restorations:
    post:
      tags: [Publishing]
      operationId: restoreMaterialRevision
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RestoreMaterialRevisionRequest"
      responses:
        "200":
          description: A new working revision copied from the selected revision.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/author/materials:
    get:
      tags: [Authoring]
      operationId: listAuthorMaterials
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Own materials, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Authoring]
      operationId: createAuthorMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMaterialRequest"
      responses:
        "201":
          description: New private draft.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/author/materials/{id}:
    get:
      tags: [Authoring]
      operationId: getAuthorMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "200":
          description: The current revision of an owned material.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Authoring]
      operationId: updateAuthorDraft
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMaterialDraftRequest"
      responses:
        "200":
          description: A new revision of an owned draft. Media references are managed by the editorial API.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/author/materials/{id}/submissions:
    post:
      tags: [Authoring]
      operationId: submitAuthorMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubmitAuthorMaterialRequest"
      responses:
        "200":
          description: Material placed in the editorial queue.
          headers:
            ETag:
              $ref: "#/components/headers/MaterialEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MaterialDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/author/catalog-options/{field}:
    get:
      tags: [Authoring]
      operationId: getAuthorCatalogOptions
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AuthorCatalogField"
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: selected
          in: query
          description: Comma-separated IDs of current selections to resolve alongside search results.
          schema: { type: string, maxLength: 3700 }
      responses:
        "200":
          description: Searchable catalog entries available to authors.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthorCatalogOptions"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/account/saved-materials:
    get:
      tags: [Authoring]
      operationId: listSavedMaterials
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Saved materials which are currently public.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SavedMaterialPage"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/account/saved-materials/{id}:
    put:
      tags: [Authoring]
      operationId: saveMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      tags: [Authoring]
      operationId: removeSavedMaterial
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialId"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/materials/{slug}:
    get:
      tags: [Publishing]
      operationId: getPublishedMaterial
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/MaterialSlug"
      responses:
        "200":
          description: Published revision when the material and all linked media remain public.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicMaterial"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/catalog/{kind}:
    get:
      tags: [Catalog]
      operationId: listCatalogEntries
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
        - name: q
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Draft, Proposed, Published, Restricted, Rejected, Merged, Approved, Hidden, Active, Archived]
        - name: parentId
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Catalog entries visible to the back office.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogPage"
        default:
          $ref: "#/components/responses/Problem"
    post:
      tags: [Catalog]
      operationId: createCatalogEntry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "201":
          description: Created catalog entry.
          headers:
            ETag:
              $ref: "#/components/headers/CatalogEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/catalog/{kind}/{id}:
    get:
      tags: [Catalog]
      operationId: getCatalogEntry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
        - $ref: "#/components/parameters/CatalogId"
      responses:
        "200":
          description: Current catalog entry.
          headers:
            ETag:
              $ref: "#/components/headers/CatalogEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDetail"
        default:
          $ref: "#/components/responses/Problem"
    patch:
      tags: [Catalog]
      operationId: updateCatalogEntry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
        - $ref: "#/components/parameters/CatalogId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogInput"
      responses:
        "200":
          description: Updated catalog entry.
          headers:
            ETag:
              $ref: "#/components/headers/CatalogEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/catalog/{kind}/{id}/transitions:
    post:
      tags: [Catalog]
      operationId: transitionCatalogEntry
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
        - $ref: "#/components/parameters/CatalogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogTransitionRequest"
      responses:
        "200":
          description: Catalog entry after its state transition.
          headers:
            ETag:
              $ref: "#/components/headers/CatalogEtag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogDetail"
        default:
          $ref: "#/components/responses/Problem"
  /api/admin/v1/catalog/{kind}/{id}/merges:
    post:
      tags: [Catalog]
      operationId: mergeCatalogEntry
      description: Administrator-only canonical merge for topics and categories.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
        - $ref: "#/components/parameters/CatalogId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CatalogMergeRequest"
      responses:
        "202":
          description: Canonical merge committed and emitted to the outbox.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CatalogMergeAccepted"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/catalog/{kind}/{slug}:
    get:
      tags: [Catalog]
      operationId: getPublicCatalogEntry
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/CatalogKind"
        - $ref: "#/components/parameters/CatalogSlug"
      responses:
        "200":
          description: Public canonical topic or category.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicCatalogEntry"
        "308":
          description: The historical slug redirects permanently to the canonical entry.
          headers:
            Location:
              required: true
              schema:
                type: string
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/media/uploads:
    post:
      tags: [Media]
      operationId: createUploadSession
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUploadRequest"
      responses:
        "201":
          description: Short-lived upload session bound to the current account session.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadSession"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/media/assets/{assetId}:
    get:
      tags: [Media]
      operationId: getMediaAsset
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AssetId"
      responses:
        "200":
          description: Current processing state and available variants.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaAsset"
        default:
          $ref: "#/components/responses/Problem"
  /api/v1/media/assets/{assetId}/read-grants:
    post:
      tags: [Media]
      operationId: createMediaReadGrant
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateReadGrantRequest"
      responses:
        "201":
          description: Short-lived read grant bound to the current session and variant.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MediaReadGrant"
        default:
          $ref: "#/components/responses/Problem"
  /media/v1/uploads/{uploadId}:
    put:
      tags: [Media]
      operationId: uploadMedia
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /media/v1/assets/{assetId}/{variant}:
    get:
      tags: [Media]
      operationId: readMedia
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/MediaGrant"
        - name: Range
          in: header
          schema:
            type: string
          example: bytes=0-1048575
      responses:
        "200":
          $ref: "#/components/responses/BinaryContent"
        "206":
          $ref: "#/components/responses/BinaryContent"
        default:
          $ref: "#/components/responses/Problem"
    head:
      tags: [Media]
      operationId: inspectMedia
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AssetId"
        - $ref: "#/components/parameters/Variant"
        - $ref: "#/components/parameters/MediaGrant"
      responses:
        "200":
          description: Media metadata headers.
          headers:
            X-Correlation-ID:
              $ref: "#/components/headers/CorrelationId"
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/uploads/{uploadId}/claim:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: claimUpload
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantRequest"
      responses:
        "200":
          description: Exclusive upload claim.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadClaim"
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/uploads/{uploadId}/complete:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: completeUpload
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/UploadId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadReceipt"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/assets/{assetId}/authorize-read:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: authorizeMediaRead
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - $ref: "#/components/parameters/AssetId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeReadRequest"
      responses:
        "200":
          description: Authorized storage reference.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadDecision"
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/inspections/lease:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: leaseInspection
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
      responses:
        "200":
          description: Inspection job lease.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InspectionLease"
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/inspections/{jobId}/complete:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: completeInspection
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InspectionResult"
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
  /internal/media/v1/storage/{locationId}/probe:
    post:
      x-internal: true
      tags: [Internal media]
      operationId: probeStorage
      security:
        - serviceToken: []
      parameters:
        - $ref: "#/components/parameters/CorrelationId"
        - name: locationId
          in: path
          required: true
          schema:
            type: string
            maxLength: 100
      responses:
        "204":
          $ref: "#/components/responses/NoContent"
        default:
          $ref: "#/components/responses/Problem"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    serviceToken:
      type: http
      scheme: bearer
      description: Private, rotated service credential.
  parameters:
    AuthorCatalogField:
      name: field
      in: path
      required: true
      schema:
        type: string
        enum: [categoryIds, topicIds, sourceIds]
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: false
      description: Optional caller correlation ID. The server echoes it or creates a safe value.
      schema:
        type: string
        maxLength: 128
        pattern: "^[A-Za-z0-9._:-]+$"
    UploadId:
      name: uploadId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssetId:
      name: assetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MaterialId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RevisionNumber:
      name: number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    MaterialSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 160
    CatalogKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [topics, categories, entities, places, sources, archive-institutions]
    CatalogId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    CatalogSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 180
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Strong material ETag returned by the latest successful read or write.
      schema:
        type: string
    Variant:
      name: variant
      in: path
      required: true
      schema:
        type: string
        enum: [original, preview]
    MediaGrant:
      name: grant
      in: query
      required: true
      schema:
        type: string
        maxLength: 4096
  headers:
    CorrelationId:
      description: Correlates logs and Problem Details across services.
      required: true
      schema:
        type: string
    MaterialEtag:
      description: Strong optimistic-concurrency token for the material aggregate.
      required: true
      schema:
        type: string
    CatalogEtag:
      description: Strong optimistic-concurrency token for one catalog entry.
      required: true
      schema:
        type: string
  requestBodies:
    Hash:
      required: true
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/HashRequest"
  responses:
    NoContent:
      description: Operation completed.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
    BinaryContent:
      description: Authorized media bytes.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
        Accept-Ranges:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Problem:
      description: RFC 9457 compatible error with a stable application code.
      headers:
        X-Correlation-ID:
          $ref: "#/components/headers/CorrelationId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetails"
  schemas:
    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok]
    ProblemDetails:
      type: object
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
        traceId:
          type: string
        errors:
          type: array
          items:
            type: string
    CatalogGeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    CatalogLifeSpan:
      type: object
      additionalProperties: false
      properties:
        fromYear:
          type: integer
          minimum: -5000
          maximum: 3000
        toYear:
          type: integer
          minimum: -5000
          maximum: 3000
    CatalogSourceRights:
      type: object
      additionalProperties: false
      required: [publicDisplayAllowed, statement]
      properties:
        publicDisplayAllowed:
          type: boolean
        statement:
          type: string
          minLength: 3
          maxLength: 2000
    CatalogSourceVerification:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [Unverified, Verified, Disputed]
        note:
          type: string
          maxLength: 2000
    CatalogArchiveReference:
      type: object
      additionalProperties: false
      properties:
        fund:
          type: string
          maxLength: 200
        inventory:
          type: string
          maxLength: 200
        archiveUnit:
          type: string
          maxLength: 200
        pageOrFrame:
          type: string
          maxLength: 200
    CatalogInput:
      type: object
      additionalProperties: false
      description: Fields are constrained further by the selected catalog kind.
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 300
        title:
          type: string
          minLength: 2
          maxLength: 500
        slug:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          maxLength: 180
        aliases:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 300
        summary:
          type: string
          maxLength: 5000
        description:
          type: string
          maxLength: 10000
        categoryIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        coverAssetId:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
        sortOrder:
          type: integer
          minimum: -100000
          maximum: 100000
        icon:
          type: string
          maxLength: 100
        isVisible:
          type: boolean
        entityType:
          type: string
          maxLength: 100
        lifeSpan:
          $ref: "#/components/schemas/CatalogLifeSpan"
        placeIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        placeType:
          type: string
          maxLength: 100
        location:
          $ref: "#/components/schemas/CatalogGeoPoint"
        historicalNames:
          type: array
          maxItems: 100
          items:
            type: string
            maxLength: 300
        sourceType:
          type: string
          maxLength: 100
        url:
          type: string
          format: uri
          maxLength: 2000
        rights:
          $ref: "#/components/schemas/CatalogSourceRights"
        verification:
          $ref: "#/components/schemas/CatalogSourceVerification"
        archiveInstitutionId:
          type: string
          format: uuid
        archiveReference:
          $ref: "#/components/schemas/CatalogArchiveReference"
        originalInstitutionName:
          type: string
          maxLength: 500
        website:
          type: string
          format: uri
          maxLength: 2000
    CatalogTransitionRequest:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action:
          type: string
          enum: [Propose, Publish, Approve, Restrict, Reject, Hide, Archive, Restore]
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
    CatalogMergeRequest:
      type: object
      additionalProperties: false
      required: [targetId, expectedVersion, targetExpectedVersion, reason]
      properties:
        targetId:
          type: string
          format: uuid
        expectedVersion:
          type: integer
          minimum: 1
        targetExpectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
    CatalogSummary:
      type: object
      additionalProperties: false
      required: [id, kind, name, slug, status, version, updatedAtUtc]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [topics, categories, entities, places, sources, archive-institutions]
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [Draft, Proposed, Published, Restricted, Rejected, Merged, Approved, Hidden, Active, Archived]
        canonicalId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        updatedAtUtc:
          type: string
          format: date-time
    CatalogDetail:
      type: object
      additionalProperties: false
      required: [id, kind, name, slug, status, version, updatedAtUtc, fields, allowedActions]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [topics, categories, entities, places, sources, archive-institutions]
        name:
          type: string
        slug:
          type: string
        status:
          type: string
          enum: [Draft, Proposed, Published, Restricted, Rejected, Merged, Approved, Hidden, Active, Archived]
        canonicalId:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        updatedAtUtc:
          type: string
          format: date-time
        fields:
          type: object
          additionalProperties: true
        allowedActions:
          type: array
          items:
            type: string
    CatalogPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogSummary"
        nextCursor:
          type: string
    CatalogMergeAccepted:
      type: object
      additionalProperties: false
      required: [operationId, statusUrl, sourceId, targetId]
      properties:
        operationId:
          type: string
          format: uuid
        statusUrl:
          type: string
        sourceId:
          type: string
          format: uuid
        targetId:
          type: string
          format: uuid
    PublicCatalogEntry:
      type: object
      additionalProperties: false
      required: [id, kind, name, slug, fields]
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum: [topics, categories]
        name:
          type: string
        slug:
          type: string
        fields:
          type: object
          additionalProperties: true
    MaterialMediaReference:
      type: object
      additionalProperties: false
      required: [mediaId, role, order]
      properties:
        mediaId:
          type: string
          format: uuid
        role:
          type: string
          minLength: 2
          maxLength: 50
        order:
          type: integer
          minimum: 0
          maximum: 1000
        credit:
          type: string
          maxLength: 300
    MaterialRights:
      type: object
      additionalProperties: false
      required: [publicDisplayAllowed, statement]
      properties:
        publicDisplayAllowed:
          type: boolean
        statement:
          type: string
          minLength: 3
          maxLength: 2000
    MaterialBlock:
      type: object
      additionalProperties: false
      required: [id, type, text]
      properties:
        id: { type: string, format: uuid }
        type:
          type: string
          enum: [Heading, Paragraph, Quote]
        text: { type: string, maxLength: 6000 }
    MaterialDraft:
      type: object
      additionalProperties: false
      required:
        [title, categoryIds, topicIds, sourceIds, mediaRefs, rights]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        subtitle:
          type: string
          maxLength: 300
        summary:
          type: string
          maxLength: 1000
        body:
          type: string
          maxLength: 100000
        blocks:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/MaterialBlock"
        categoryIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        topicIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        sourceIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        mediaRefs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MaterialMediaReference"
        provenance:
          type: string
          maxLength: 2000
        rights:
          $ref: "#/components/schemas/MaterialRights"
    CreateMaterialRequest:
      type: object
      additionalProperties: false
      required: [type, language, title]
      properties:
        type:
          type: string
          enum: [Story, Document, PhotoEssay, Episode]
        language:
          type: string
          pattern: "^[a-z]{2}(?:-[A-Z]{2})?$"
        title:
          type: string
          minLength: 3
          maxLength: 200
    UpdateMaterialDraftRequest:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 200
        subtitle:
          type: string
          maxLength: 300
        summary:
          type: string
          maxLength: 1000
        body:
          type: string
          maxLength: 100000
        blocks:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/MaterialBlock"
        categoryIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        topicIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        sourceIds:
          type: array
          maxItems: 100
          items:
            type: string
            format: uuid
        mediaRefs:
          type: array
          maxItems: 100
          items:
            $ref: "#/components/schemas/MaterialMediaReference"
        provenance:
          type: string
          maxLength: 2000
        rights:
          $ref: "#/components/schemas/MaterialRights"
        changeSummary:
          type: string
          maxLength: 500
    TransitionMaterialRequest:
      type: object
      additionalProperties: false
      required: [action, expectedVersion]
      properties:
        action:
          type: string
          enum:
            - SubmitForReview
            - StartReview
            - RequestChanges
            - Publish
            - Withdraw
            - Archive
            - RestoreFromArchive
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
    RestoreMaterialRevisionRequest:
      type: object
      additionalProperties: false
      required: [revisionNumber, expectedVersion, reason]
      properties:
        revisionNumber:
          type: integer
          minimum: 1
        expectedVersion:
          type: integer
          minimum: 1
        reason:
          type: string
          minLength: 3
          maxLength: 500
    MaterialRevisionSummary:
      type: object
      additionalProperties: false
      required:
        [materialId, revisionNumber, createdAtUtc, createdByUserId]
      properties:
        materialId:
          type: string
          format: uuid
        revisionNumber:
          type: integer
          minimum: 1
        createdAtUtc:
          type: string
          format: date-time
        createdByUserId:
          type: string
          format: uuid
        changeSummary:
          type: string
        restoredFromRevisionNumber:
          type: integer
          minimum: 1
    MaterialRevisionDetail:
      allOf:
        - $ref: "#/components/schemas/MaterialRevisionSummary"
        - type: object
          required: [content]
          properties:
            content:
              $ref: "#/components/schemas/MaterialDraft"
    MaterialRevisionPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaterialRevisionSummary"
        nextCursor:
          type: string
    MaterialSummary:
      type: object
      additionalProperties: false
      required: [id, slug, title, status, version, updatedAtUtc]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [Unpublished, Published, Withdrawn, Archived]
        workingStatus:
          type: string
          enum: [Draft, Submitted, InReview, ChangesRequested]
        version:
          type: integer
          minimum: 1
        updatedAtUtc:
          type: string
          format: date-time
    MaterialPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/MaterialSummary"
        nextCursor:
          type: string
    MaterialDetail:
      type: object
      additionalProperties: false
      required:
        - id
        - slug
        - type
        - language
        - authorId
        - status
        - publicVisibility
        - draft
        - allowedActions
        - publicationBlockers
        - version
        - updatedAtUtc
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        type:
          type: string
          enum: [Story, Document, PhotoEssay, Episode]
        language:
          type: string
        authorId:
          type: string
          format: uuid
        status:
          type: string
          enum: [Unpublished, Published, Withdrawn, Archived]
        workingStatus:
          type: string
          enum: [Draft, Submitted, InReview, ChangesRequested]
        workingRevisionNumber:
          type: integer
          minimum: 1
        publishedRevisionNumber:
          type: integer
          minimum: 1
        publicVisibility:
          type: boolean
        draft:
          $ref: "#/components/schemas/MaterialDraft"
        allowedActions:
          type: array
          items:
            type: string
        publicationBlockers:
          type: array
          items:
            type: string
        correctionNote: { type: string, maxLength: 500 }
        version:
          type: integer
          minimum: 1
        updatedAtUtc:
          type: string
          format: date-time
    SubmitAuthorMaterialRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    AuthorCatalogOption:
      type: object
      required: [id, label]
      properties:
        id: { type: string, format: uuid }
        label: { type: string }
    AuthorCatalogOptions:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/AuthorCatalogOption"
    SavedMaterial:
      type: object
      required: [id, slug, title, savedAtUtc]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        title: { type: string }
        savedAtUtc: { type: string, format: date-time }
    SavedMaterialPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SavedMaterial"
    PublicMaterial:
      type: object
      additionalProperties: false
      required: [id, slug, type, language, revisionNumber, content]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        type:
          type: string
          enum: [Story, Document, PhotoEssay, Episode]
        language:
          type: string
        revisionNumber:
          type: integer
          minimum: 1
        content:
          $ref: "#/components/schemas/MaterialDraft"
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 72
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password, firstName, lastName]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 72
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
    HashRequest:
      type: object
      additionalProperties: false
      required: [hash]
      properties:
        hash:
          type: string
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
    ResetPasswordRequest:
      type: object
      additionalProperties: false
      required: [hash, password]
      properties:
        hash:
          type: string
        password:
          type: string
          minLength: 6
          maxLength: 72
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
          maxLength: 72
        oldPassword:
          type: string
    Profile:
      type: object
      additionalProperties: false
      required: [id, email, firstName, lastName, role]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        mfaEnabled:
          type: boolean
    Role:
      type: string
      enum: [User, Editor, Administrator]
    TokenPair:
      type: object
      additionalProperties: false
      required: [token, refreshToken, tokenExpires]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        tokenExpires:
          type: integer
          format: int64
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, refreshToken, tokenExpires, user]
      properties:
        token:
          type: string
        refreshToken:
          type: string
        tokenExpires:
          type: integer
          format: int64
        user:
          $ref: "#/components/schemas/Profile"
    BackOfficePrincipal:
      type: object
      additionalProperties: false
      required: [id, displayName, role, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        role:
          type: string
          enum: [Editor, Administrator]
        permissions:
          type: array
          items:
            type: string
        mfaVerifiedAtUtc:
          type: string
          format: date-time
    MfaEnrollmentRequest:
      type: object
      additionalProperties: false
      required: [currentPassword]
      properties:
        currentPassword:
          type: string
          format: password
          minLength: 6
          maxLength: 72
    MfaEnrollment:
      type: object
      additionalProperties: false
      required: [secret, provisioningUri]
      properties:
        secret:
          type: string
          pattern: "^[A-Z2-7]{32}$"
        provisioningUri:
          type: string
          format: uri
    MfaCodeRequest:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code:
          type: string
          pattern: '^\\d{6}$'
    MfaRecoveryCodeRequest:
      type: object
      additionalProperties: false
      required: [recoveryCode]
      properties:
        recoveryCode:
          type: string
          pattern: "^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$"
    MfaRecoveryCodes:
      type: object
      additionalProperties: false
      required: [recoveryCodes]
      properties:
        recoveryCodes:
          type: array
          minItems: 10
          maxItems: 10
          items:
            type: string
            pattern: "^[A-Z2-7]{4}(?:-[A-Z2-7]{4}){3}$"
    CreateUploadRequest:
      type: object
      additionalProperties: false
      required: [purpose, length, sha256]
      properties:
        purpose:
          type: string
          enum:
            [
              profile-image,
              material-original,
              source-document,
              advertisement-creative,
            ]
        length:
          type: integer
          format: int64
          minimum: 1
          maximum: 33554432
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        alternativeText:
          type: string
          minLength: 3
          maxLength: 500
          description: Accessible description supplied by the author.
        rightsEvidence:
          type: string
          minLength: 3
          maxLength: 2000
          description: Source, permission or licence evidence for editorial review.
    UploadSession:
      type: object
      additionalProperties: false
      required:
        [uploadId, uploadUrl, grant, expiresAtUtc, maxBytes, attemptVersion]
      properties:
        uploadId:
          type: string
          format: uuid
        uploadUrl:
          type: string
          pattern: "^/media/v1/uploads/[0-9a-f-]+$"
        grant:
          type: string
        expiresAtUtc:
          type: string
          format: date-time
        maxBytes:
          type: integer
          format: int64
        attemptVersion:
          type: integer
          minimum: 1
    MediaAsset:
      type: object
      additionalProperties: false
      required: [id, processingStatus, variants]
      properties:
        id:
          type: string
          format: uuid
        processingStatus:
          type: string
          enum: [Pending, Claimed, Ready, Failed]
        contentType:
          type: string
        alternativeText:
          type: string
          maxLength: 500
        rightsEvidence:
          type: string
          maxLength: 2000
        correlationId:
          type: string
          maxLength: 128
          pattern: "^[A-Za-z0-9._:-]+$"
          description: Correlation ID captured when the upload session was created.
        variants:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [original, preview]
    CreateReadGrantRequest:
      type: object
      additionalProperties: false
      required: [variant]
      properties:
        variant:
          type: string
          enum: [original, preview]
    MediaReadGrant:
      type: object
      additionalProperties: false
      required: [assetId, variant, grant, url, expiresAtUtc]
      properties:
        assetId:
          type: string
          format: uuid
        variant:
          type: string
          enum: [original, preview]
        grant:
          type: string
        url:
          type: string
          pattern: "^/media/v1/assets/[0-9a-f-]+/(?:original|preview)$"
        expiresAtUtc:
          type: string
          format: date-time
    GrantRequest:
      type: object
      additionalProperties: false
      required: [grant]
      properties:
        grant:
          type: string
          maxLength: 4096
    AuthorizeReadRequest:
      type: object
      additionalProperties: false
      required: [grant, variant]
      properties:
        grant:
          type: string
          maxLength: 4096
        variant:
          type: string
          enum: [original, preview]
    ObjectReference:
      type: object
      additionalProperties: false
      required: [storageLocationId, fileKey]
      properties:
        storageLocationId:
          type: string
          maxLength: 100
        fileKey:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UploadClaim:
      type: object
      additionalProperties: false
      required: [attemptId, object, length, sha256]
      properties:
        attemptId:
          type: string
          format: uuid
        attemptVersion:
          type: integer
          minimum: 1
        object:
          $ref: "#/components/schemas/ObjectReference"
        length:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
    UploadReceipt:
      type: object
      additionalProperties: false
      required: [attemptId, length, sha256, contentType]
      properties:
        attemptId:
          type: string
          format: uuid
        length:
          type: integer
          format: int64
        sha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        contentType:
          type: string
    ReadDecision:
      type: object
      additionalProperties: false
      required: [object, length, contentType]
      properties:
        object:
          $ref: "#/components/schemas/ObjectReference"
        length:
          type: integer
          format: int64
        contentType:
          type: string
    InspectionLease:
      type: object
      additionalProperties: false
      required: [jobId, attemptId, object, length, sha256]
      properties:
        jobId:
          type: string
          format: uuid
        attemptId:
          type: string
          format: uuid
        object:
          $ref: "#/components/schemas/ObjectReference"
        previewObject:
          $ref: "#/components/schemas/ObjectReference"
        length:
          type: integer
          format: int64
        sha256:
          type: string
    InspectionResult:
      type: object
      additionalProperties: false
      required: [attemptId, outcome]
      properties:
        attemptId:
          type: string
          format: uuid
        outcome:
          type: string
          enum: [inspected, missing, integrity_mismatch, unsupported_format]
        length:
          type: integer
          format: int64
        sha256:
          type: string
        contentType:
          type: string
        previewObject:
          $ref: "#/components/schemas/ObjectReference"
        previewLength:
          type: integer
          format: int64
        previewSha256:
          type: string
          pattern: "^[a-f0-9]{64}$"
        previewContentType:
          type: string
